name: Build QEMU iOS engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-engine:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode applications:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          test -d "$XCODE_APP/Contents/Developer"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Selected iPhoneOS SDK: $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "Project Astra's on-device pairing code uses iOS 26 SDK APIs; install/select Xcode 26 or newer." >&2
            exit 1
          fi
      # Keep Meson/Ninja outputs and downloaded target dependencies between
      # manual engine builds. The build root is stable so restored paths remain valid.
      - name: Restore QEMU iOS build cache
        uses: actions/cache@v4
        with:
          path: .build/qemu-ios
          key: astra-qemu-ios-${{ runner.os }}-${{ hashFiles('scripts/build-qemu-ios-engine.sh', 'scripts/stage-qemu-iphone4.sh', 'scripts/patch-qemu-ios-apple-aes.py') }}
          restore-keys: |
            astra-qemu-ios-${{ runner.os }}-

      - name: Install native QEMU build dependencies
        run: brew install glib pixman libslirp ninja meson pkgconf

      - name: Cross-build QEMU for iOS ARM64
        env:
          QEMU_IOS_BUILD_ROOT: ${{ github.workspace }}/.build/qemu-ios
        run: bash scripts/build-qemu-ios-engine.sh

      - name: Upload iOS QEMU engine
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-arm64-engine
          path: ios/Frameworks/libqemu-arm.dylib
          if-no-files-found: error
          retention-days: 14
