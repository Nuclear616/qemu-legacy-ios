name: Build QEMU iOS engine

on:
  workflow_dispatch:
  push:
    branches:
      - 'engine/**'
    paths:
      - 'scripts/build-qemu-ios-engine.sh'
      - 'scripts/stage-qemu-iphone4.sh'
      - 'scripts/patch-qemu-iphone4-meson.py'
      - '.github/workflows/build-qemu-ios-engine.yml'
      - 'vendor/**'

permissions:
  contents: write

jobs:
  build-ios-engine:
    runs-on: macos-15-intel
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content
      QEMU_IOS_BUILD_ROOT: ${{ github.workspace }}/.build/qemu-ios
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: |
          set -euo pipefail
          echo "Installed Xcode applications:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then XCODE_APP="/Applications/Xcode.app"; fi
          test -d "$XCODE_APP/Contents/Developer"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "Selected iPhoneOS SDK: $SDK_VERSION"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "Project Astra's on-device pairing code uses iOS 26 SDK APIs; install/select Xcode 26 or newer." >&2
            exit 1
          fi
      - name: Restore compiler and dependency caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/ccache
            ${{ runner.temp }}/qemu-ios/deps
          key: qemu-ios-${{ runner.os }}-${{ runner.arch }}-xcode26-db230fe8-c6da8592
          restore-keys: |
            qemu-ios-${{ runner.os }}-${{ runner.arch }}-xcode26-

      - name: Install native QEMU build dependencies
        run: brew install glib pixman libslirp ninja meson pkgconf ccache

      - name: Cross-build QEMU for iOS ARM64
        run: bash scripts/build-qemu-ios-engine.sh

      - name: Publish versioned QEMU engine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LIB="ios/Frameworks/libqemu-arm.dylib"
          ENGINE_TAG="qemu-engine-${GITHUB_SHA:0:12}"
          ENGINE_SHA256="$(shasum -a 256 "$LIB" | awk '{print $1}')"
          gh release create "$ENGINE_TAG" "$LIB" \
            --target "$GITHUB_SHA" \
            --title "Project Astra QEMU Engine ${GITHUB_SHA:0:12}" \
            --notes "Automatically built iOS ARM64 QEMU engine. SHA-256: $ENGINE_SHA256"

          git fetch origin engine-binaries
          git worktree add "$RUNNER_TEMP/engine-manifest" origin/engine-binaries
          python3 - "$RUNNER_TEMP/engine-manifest/manifest.json" "$ENGINE_TAG" "$ENGINE_SHA256" "$GITHUB_SHA" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          manifest = {
              "schema_version": 1,
              "engine_version": sys.argv[2],
              "source_commit": sys.argv[4],
              "release_tag": sys.argv[2],
              "sha256": sys.argv[3],
              "architecture": "arm64",
              "library": "libqemu-arm.dylib",
              "required_symbols": [
                  "qemu_ios_main", "qemu_ios_ui_attach", "qemu_ios_ui_frame",
                  "qemu_ios_ui_touch", "qemu_ios_ui_button", "qemu_ios_ui_ready",
                  "qemu_ios_ui_storage_failed", "qemu_ios_ui_guest_shutdown_confirmed"
              ]
          }
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          git -C "$RUNNER_TEMP/engine-manifest" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/engine-manifest" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/engine-manifest" add manifest.json
          git -C "$RUNNER_TEMP/engine-manifest" commit -m "Publish QEMU engine manifest $ENGINE_TAG"
          git -C "$RUNNER_TEMP/engine-manifest" push origin HEAD:engine-binaries
