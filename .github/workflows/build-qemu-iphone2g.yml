name: Verify QEMU · iPhone 2G target

on:
  workflow_dispatch:

permissions:
  contents: read

# The iPhone 2G machine is compiled into the same multi-device engine as A4.
# Do not spend a second macOS runner rebuilding an identical dylib.
jobs:
  preflight:
    name: Confirm iPhone 2G engine integration
    runs-on: ubuntu-latest
    steps:
      - name: Report combined-engine build path
        run: |
          echo "Original iPhone 2G / M68AP is enabled through CONFIG_IPOD_TOUCH_1G."
          echo "Machine type: -M iPhone-2G"
          echo "It is included in the combined A4 + iPhone 2G engine artifact."
          echo "Use the Build QEMU · Multi-device (A4 + iPhone 2G) workflow to compile the dylib."
          echo "Astra's M68AP firmware importer and boot arguments are still pending."
